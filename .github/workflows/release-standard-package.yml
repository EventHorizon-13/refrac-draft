name: Release standard package

on:
  push:
    branches:
      - feat/standard-edition

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-edition
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44033082044 \
            --repo EventHorizon-13/refrac-draft \
            --name RefracDraft-Standard-Windows-x64-portable-layout-fix \
            --dir package

      - name: Package release asset
        run: |
          cd package
          zip -qr /tmp/RefracDraft-Standard-Windows-x64-portable-a70061c.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create standard-20261117 \
            /tmp/RefracDraft-Standard-Windows-x64-portable-a70061c.zip \
            --repo EventHorizon-13/refrac-draft \
            --target a70061ce7c7d325c03f52adff7393378b6d65d09 \
            --title "RefracDraft Standard 2026-11-17" \
            --notes "Corrected drawing layout, anchor dimensions, _10 dimensions, big-font DXF text, and theme-aware preview."

      - name: Remove temporary release workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-standard-package.yml
          git commit -m "ci: remove temporary release workflow"
          git push origin HEAD:feat/standard-edition
