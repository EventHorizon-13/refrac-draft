name: Release standard table PDF package

on:
  push:
    branches:
      - feat/standard-edition
    paths:
      - .github/workflows/release-standard-package.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified Windows artifact
        run: |
          gh run download 44050009749 \
            --repo EventHorizon-13/refrac-draft \
            --name RefracDraft-Standard-Windows-x64-portable \
            --dir package

      - name: Package release asset
        run: |
          cd package
          zip -qr /tmp/RefracDraft-Standard-Windows-x64-portable-0dfaa007.zip .

      - name: Publish GitHub release
        run: |
          gh release create standard-20261117-table-pdf \
            /tmp/RefracDraft-Standard-Windows-x64-portable-0dfaa007.zip \
            --repo EventHorizon-13/refrac-draft \
            --target 0dfaa0078f5692281e6142c2884467e34cacd47a \
            --title "RefracDraft Standard 2026-11-17 · Table & DXF PDF" \
            --notes "参数区改为单行一模块的表格，支持选区右下角拖动填充和 Excel/WPS 多格粘贴；勾选锚固件后才显示锚固列，菱形锚固件使用嵌入深度且不显示插针。预览区改为左侧输出设置、右侧 A4 预览，可设置工作目录和自定义文件名。PDF 改为从与 DXF 同源的图纸直接渲染，并内置中文字体处理。包含自动排版、自动分页、短分隔线、深浅主题适配和锚固件/大小头修正。" \
            --latest
