name: Windows x64 standard

on:
  push:
    branches:
      - feat/standard-edition
      - beta/standard-v*
    paths:
      - .github/workflows/windows-standard.yml
      - src/**
      - pyproject.toml
      - docs/WINDOWS_STANDARD.md
      - .github/workflows/publish-standard-release.yml
      - assets/pdf-exporter/**
      - examples/standard_example_6_modules.xlsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[ui]" "pyinstaller==6.22.3"
      - name: Prepare bundled CJK fonts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "assets/fonts" | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf" `
            -OutFile "assets/fonts/SourceHanSansSC-Regular.otf"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/adobe-fonts/source-han-serif/release/OTF/SimplifiedChinese/SourceHanSerifSC-Regular.otf" `
            -OutFile "assets/fonts/SourceHanSerifSC-Regular.otf"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/adobe-fonts/source-han-serif/release/LICENSE.txt" `
            -OutFile "assets/fonts/LICENSE-SourceHanSerif.txt"
      - name: Prepare SHX PDF renderer runtime
        shell: pwsh
        run: |
          $zip = "roller-seal-pdf-runtime.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/EventHorizon-13/solidcraft-roller-seal/releases/download/v2.4.11/StandardRollerSeal-windows-amd64.zip" `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath "roller-seal-runtime" -Force
          $exporter = Get-ChildItem -Path "roller-seal-runtime" -Directory -Recurse |
            Where-Object { $_.Name -eq "PdfExporter" } |
            Select-Object -First 1
          if (-not $exporter) { throw "Roller Seal PDF exporter was not found in the pinned Windows package." }
          New-Item -ItemType Directory -Force "assets/pdf-exporter" | Out-Null
          Copy-Item (Join-Path $exporter.FullName "*") "assets/pdf-exporter" -Recurse -Force
          if (-not (Test-Path "assets/pdf-exporter/node.exe")) { throw "PdfExporter/node.exe is missing." }
          if (-not (Test-Path "assets/pdf-exporter/pdf-exporter.bundle.mjs")) { throw "pdf-exporter.bundle.mjs is missing." }
      - name: Record build version and time
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Cannot read project version." }
          Set-Content -Encoding ascii "assets/build-version.txt" $version
          "REFRACDRAFT_EXPECTED_VERSION=$version" >> $env:GITHUB_ENV
          [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'") |
            Set-Content -Encoding ascii "assets/build-time.txt"
      - name: Build one-folder application
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RefracDraft-Standard --paths src
          --icon assets/RefracDraft.ico
          --add-data "references:references"
          --add-data "assets:assets"
          --add-data "examples/b2_positive_tap.json:examples"
          --add-data "examples/standard_example_6_modules.xlsx:examples"
          --collect-data reportlab
          --collect-submodules ezdxf
          --copy-metadata refrac-draft
          src/refracdraft/standard_app.py
      - name: Exercise bundled references and vector exporters
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Join-Path $PWD "dist/RefracDraft-Standard/RefracDraft-Standard.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path "RefracDraft-Standard-smoke-error.txt") {
            Get-Content "RefracDraft-Standard-smoke-error.txt"
            throw "Packaged application smoke test failed."
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "RefracDraft-Standard-smoke-trace.txt") {
              Get-Content "RefracDraft-Standard-smoke-trace.txt"
            }
            throw "Packaged application exited with code $($process.ExitCode)."
          }
      - name: Add portable instructions
        if: always()
        shell: pwsh
        run: |
          Copy-Item "docs/WINDOWS_STANDARD.md" "dist/RefracDraft-Standard/README.md"
          New-Item -ItemType Directory -Force "dist/RefracDraft-Standard/fonts" | Out-Null
          Set-Content -Encoding utf8 "dist/RefracDraft-Standard/fonts/README.txt" "Place external SHX, TTF, OTF or TTC fonts in this folder."
          if (Test-Path "RefracDraft-Standard-ui.png") {
            Copy-Item "RefracDraft-Standard-ui.png" "dist/RefracDraft-Standard/UI-PREVIEW.png"
          }
          python -m pip freeze | Out-File "dist/RefracDraft-Standard/BUILD-DEPENDENCIES.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: RefracDraft-Standard-Windows-x64-portable
          path: dist/RefracDraft-Standard/
          if-no-files-found: error
          retention-days: 30

  publish-beta:
    if: startsWith(github.ref, 'refs/heads/beta/standard-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RefracDraft-Standard-Windows-x64-portable
          path: release/RefracDraft-Standard
      - name: Publish verified Beta package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG="standard-v$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ || "$GITHUB_REF_NAME" != "beta/$TAG" ]]; then
            echo "Beta release branch must match package version $VERSION" >&2
            exit 1
          fi
          ASSET="RefracDraft-Standard-Windows-x64-portable-v$VERSION.zip"
          (cd release && zip -q -r "$GITHUB_WORKSPACE/$ASSET" RefracDraft-Standard)
          gh release create "$TAG" \
            "$ASSET" \
            "examples/standard_example_6_modules.xlsx#模块加工图示例_6模块.xlsx" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "RefracDraft Standard v$VERSION (Beta)" \
            --notes-file "docs/releases/$TAG.md"
