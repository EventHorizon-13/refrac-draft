name: Publish standard release

on:
  push:
    tags:
      - standard-*

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find verified build for release
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == standard-v* ]]; then
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            if [[ "$GITHUB_REF_NAME" != "standard-v$VERSION" ]]; then
              echo "Release tag does not match package version $VERSION" >&2
              exit 1
            fi
            SOURCE_SHA="$GITHUB_SHA"
          else
            SOURCE_SHA=$(git rev-parse "$GITHUB_SHA^1")
          fi
          BUILD_RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow windows-standard.yml \
            --commit "$SOURCE_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$BUILD_RUN_ID" ]; then
            echo "No successful Windows build found for $SOURCE_SHA" >&2
            exit 1
          fi
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download verified portable build
        uses: actions/download-artifact@v4
        with:
          name: RefracDraft-Standard-Windows-x64-portable
          path: release/RefracDraft-Standard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.build_run_id }}

      - name: Package release asset
        run: |
          ASSET_NAME="RefracDraft-Standard-Windows-x64-portable-${GITHUB_REF_NAME#standard-}.zip"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          cd release
          zip -r "$GITHUB_WORKSPACE/$ASSET_NAME" RefracDraft-Standard

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ steps.build.outputs.build_run_id }}
        run: |
          NOTES_FILE="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "Windows x64 便携版。打包冒烟验证：GitHub Actions run $BUILD_RUN_ID。示例 Excel 随包提供。")
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/$ASSET_NAME" \
            "examples/standard_example_6_modules.xlsx#模块加工图示例_6模块.xlsx" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RefracDraft Standard ${GITHUB_REF_NAME#standard-}" \
            "${NOTES_ARGS[@]}"
