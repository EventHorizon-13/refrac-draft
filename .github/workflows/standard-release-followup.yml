name: Standard followup release retry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/standard-edition

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release-standard-followup-20261118'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-edition
          fetch-depth: 0
          persist-credentials: true
      - name: Apply remaining followup patch
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_SHA"
          git cat-file blob "$HEAD_SHA:.refrac-standard-followup.patch.gz.b64" | gzip -d > /tmp/refrac-standard-followup.patch
          git apply --exclude=README.md --exclude=docs/WINDOWS_STANDARD.md --check /tmp/refrac-standard-followup.patch
          git apply --exclude=README.md --exclude=docs/WINDOWS_STANDARD.md /tmp/refrac-standard-followup.patch
          rm -f .github/workflows/standard-release-followup.yml .github/workflows/standard-release-retry.yml
          git config user.name "RefracDraft Release Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: complete standard editor interaction [skip ci]"
          git push origin HEAD:feat/standard-edition
      - name: Install build dependencies
        run: python -m pip install -e ".[ui]" "pyinstaller==6.22.3"
      - name: Prepare PDF CJK font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "assets/fonts" | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf" `
            -OutFile "assets/fonts/SourceHanSansSC-Regular.otf"
      - name: Build one-folder application
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RefracDraft-Standard --paths src
          --add-data "references:references"
          --add-data "assets:assets"
          --add-data "examples/b2_positive_tap.json:examples"
          --add-data "examples/standard_example_6_modules.xlsx:examples"
          --collect-data reportlab
          --collect-submodules ezdxf
          src/refracdraft/standard_app.py
      - name: Add portable instructions
        shell: pwsh
        run: |
          Copy-Item "docs/WINDOWS_STANDARD.md" "dist/RefracDraft-Standard/README.md"
          python -m pip freeze | Out-File "dist/RefracDraft-Standard/BUILD-DEPENDENCIES.txt" -Encoding utf8
          Compress-Archive -Path "dist/RefracDraft-Standard" -DestinationPath "RefracDraft-Standard-Windows-x64-portable-20261118-followup.zip" -Force
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standard-20261118-editor-followup
          target_commitish: feat/standard-edition
          name: RefracDraft Standard 2026-11-18 交互与字体修复
          body: |
            ## 本次更新

            - 菱形锚固件嵌入深度按夹板面上表面对齐，图形和标注使用同一真实深度。
            - PDF 外挂字体目录支持递归扫描，并把选中字体应用到全部文字样式，避免混用字体。
            - 预览支持鼠标滚轮翻页、Ctrl+滚轮缩放，预览页控件移入预览区域。
            - 参数表支持单击直接编辑、输入覆盖原值、下拉列单击弹菜单、复选框单击切换并居中。
            - 未勾选大小头、夹板、锚固件时，相关参数列直接隐藏。
            - 仅保留模块材质、类型、夹板型号、锚固件类型、锚固件材质、插针、胶管的下拉选项，其他输入保持自定义。
            - 「生成图纸」改为「预览」，并放到导出按钮上方；模块增删和模块数量信息已调整位置。
            - 新增 6 个不同尺寸、锚固件数量 1~3、左 150 / 间距 300 的示例 Excel。
          files: RefracDraft-Standard-Windows-x64-portable-20261118-followup.zip
          draft: false
          prerelease: false
