name: Release Standard 20261118

on:
  push:
    branches:
      - release-standard-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .refrac-release-20261118.patch.gz.b64 | gzip -d > /tmp/refrac-20261118.patch
          git apply --check /tmp/refrac-20261118.patch
          git apply /tmp/refrac-20261118.patch
          rm -f .refrac-release-20261118.patch.gz.b64 .github/workflows/release-standard-20261118.yml
          git config user.name "RefracDraft Release Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: standard editor release fixes [skip ci]"
          git push origin HEAD:feat/standard-edition

  build:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-edition
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[ui]" "pyinstaller==6.22.3"
      - name: Prepare PDF CJK font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "assets/fonts" | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf" `
            -OutFile "assets/fonts/SourceHanSansSC-Regular.otf"
      - name: Build one-folder application
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RefracDraft-Standard --paths src
          --add-data "references:references"
          --add-data "assets:assets"
          --add-data "examples/b2_positive_tap.json:examples"
          --collect-data reportlab
          --collect-submodules ezdxf
          src/refracdraft/standard_app.py
      - name: Add portable instructions
        shell: pwsh
        run: |
          Copy-Item "docs/WINDOWS_STANDARD.md" "dist/RefracDraft-Standard/README.md"
          python -m pip freeze | Out-File "dist/RefracDraft-Standard/BUILD-DEPENDENCIES.txt" -Encoding utf8
          Compress-Archive -Path "dist/RefracDraft-Standard" -DestinationPath "RefracDraft-Standard-Windows-x64-portable-20261118.zip" -Force
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: standard-20261118-editor-fixes
          target_commitish: feat/standard-edition
          name: RefracDraft Standard 2026-11-18 参数表与 PDF 修复
          body: |
            ## 本次更新

            - 菱形锚固件图形位置严格跟随真实嵌入深度，尺寸与图形一致。
            - PDF 支持外挂字体目录，遵循图层打印开关，`不打印`/`Defpoints` 图层不进入 PDF。
            - 参数表改用短型号、无单位表头、全居中单元格；容重前移，复选列不再显示“是/否”。
            - 支持选中后直接编辑、拖动填充、Excel/WPS 粘贴、双击表头修改整列。
            - 增加 `Ctrl+Z` 撤销和 `Ctrl+Y` / `Ctrl+Shift+Z` 重做。
            - 记住上次工作目录和 PDF 字体目录。
            - 默认文件名改为 `模块加工图_月日_`。
            - 图下说明文字调小，各行字号统一。
            - 重新整理顶部工具栏和输出区按钮。

            Windows x64 便携版：完整解压 ZIP 后运行 `RefracDraft-Standard.exe`。
          files: RefracDraft-Standard-Windows-x64-portable-20261118.zip
          draft: false
          prerelease: false
